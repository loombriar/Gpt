<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loom Briar — Enter the Briar</title>
<meta name="description" content="Enter the moonlit gates of Loom Briar.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02080b;color:#f4eddc;font-family:Georgia,'Times New Roman',serif}.gate{min-height:100svh;display:grid;place-items:center;background:linear-gradient(90deg,rgba(1,7,12,.72),rgba(1,7,12,.06) 62%,rgba(1,7,12,.28)),url('assets/briar-gate-real.jpg') center/cover no-repeat;position:relative;overflow:hidden}.gate:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,8,.12),transparent 68%,#02080b);pointer-events:none}.brand{position:absolute;z-index:2;top:18px;left:clamp(18px,4vw,62px);display:flex;align-items:center;gap:10px;color:#f4eddc;text-decoration:none;font:700 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.brand img{width:38px;height:38px;border-radius:50%}.copy{position:relative;z-index:2;width:min(90%,1200px)}.copy-inner{width:min(430px,44vw);padding:clamp(24px,4vw,52px);background:linear-gradient(120deg,rgba(2,9,12,.76),rgba(2,9,12,.06))}.eyebrow{margin:0 0 14px;color:#c9ad6c;font:700 9px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase}h1{margin:0 0 18px;font-size:clamp(54px,7vw,105px);font-weight:400;line-height:.9}p{font-size:clamp(14px,1.4vw,18px);font-style:italic;line-height:1.55}.enter{display:inline-block;margin-top:16px;color:#f4eddc;text-decoration:none;border-bottom:1px solid #d4b66f;padding-bottom:7px;font:700 9px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}.fireflies{position:absolute;inset:0;pointer-events:none;z-index:1}.fireflies i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff6a9;box-shadow:0 0 5px 1px #e8d962;animation:drift 6s ease-in-out infinite alternate,blink 2s infinite}.fireflies i:nth-child(1){left:12%;top:26%}.fireflies i:nth-child(2){left:28%;top:72%;animation-delay:-2s}.fireflies i:nth-child(3){left:47%;top:35%;animation-delay:-4s}.fireflies i:nth-child(4){left:66%;top:78%;animation-delay:-1s}.fireflies i:nth-child(5){left:82%;top:22%;animation-delay:-3s}.fireflies i:nth-child(6){left:91%;top:59%;animation-delay:-5s}@keyframes drift{to{transform:translate(15px,-28px)}}@keyframes blink{50%{opacity:.25}}
@media(max-width:700px){.gate{background-size:auto 100%;background-position:center top;align-items:end}.copy{margin-bottom:7vh}.copy-inner{width:min(84vw,340px);padding:22px;background:rgba(2,9,12,.64)}h1{font-size:50px}}
@media(prefers-reduced-motion:reduce){.fireflies i{animation:none}}
</style>
</head>
<body><main class="gate"><a class="brand" href="treehouse.html"><img src="assets/loom-briar-celestial-cat-logo.webp" alt=""><span>Loom Briar</span></a><div class="fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><section class="copy"><div class="copy-inner"><p class="eyebrow">At the edge of the Briar Woods</p><h1>The gate remembers you.</h1><p>Step softly. Something magical is waiting beyond the thorns.</p><a class="enter" href="treehouse.html">Enter the Briar →</a></div></section></main></body>
