<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loom Briar — Enter the Treehouse</title>
<meta name="description" content="Enter the moonlit Loom Briar treehouse.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:#f5efdf;font-family:Georgia,'Times New Roman',serif}.opening{position:relative;width:100%;height:100svh;overflow:hidden;background:#020711}.world{position:absolute;inset:-2%;background:linear-gradient(90deg,rgba(1,7,14,.16),transparent 55%,rgba(1,7,14,.24)),url('assets/loom-briar-moonlit-cat-grove-opening.webp') center/cover no-repeat;transform-origin:50% 48%;transition:transform 4.6s cubic-bezier(.22,.7,.18,1),filter 4.6s ease}.opening.following .world{transform:scale(1.62) translateY(7%);filter:brightness(1.15) blur(1px)}.brand{position:absolute;z-index:5;top:18px;left:clamp(18px,4vw,62px);display:flex;align-items:center;gap:10px;color:#f5efdf;text-decoration:none;font:700 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.brand img{width:38px;height:38px;border-radius:50%}.copy{position:absolute;z-index:5;right:clamp(18px,5vw,75px);top:50%;width:min(390px,40vw);padding:clamp(20px,4vw,46px);background:linear-gradient(120deg,rgba(2,8,15,.7),rgba(2,8,15,.04));transform:translateY(-50%);transition:opacity .65s,transform .65s}.eyebrow{margin:0 0 12px;color:#c9af72;font:700 9px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase}h1{margin:0 0 16px;font-size:clamp(54px,7vw,105px);font-weight:400;line-height:.88}p{font-size:clamp(14px,1.4vw,18px);font-style:italic;line-height:1.55}.follow{margin-top:15px;padding:0 0 7px;border:0;border-bottom:1px solid #d7bb76;background:none;color:#f5efdf;cursor:pointer;font:700 9px Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase}.ferret{position:absolute;z-index:4;left:50%;bottom:-16%;width:clamp(105px,12vw,185px);height:auto;transform:translateX(-50%);filter:drop-shadow(0 10px 16px rgba(0,0,0,.6));animation:ferretIdle 1.5s ease-in-out infinite alternate}.opening.following .copy{opacity:0;transform:translateY(-45%) scale(.97);pointer-events:none}.opening.following .ferret{animation:ferretRun 4.25s cubic-bezier(.2,.64,.24,1) forwards}.veil{position:absolute;z-index:6;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(213,226,255,.92),rgba(81,111,198,.32) 36%,rgba(1,6,15,.96) 100%);opacity:0;transition:opacity .85s ease 3.7s}.opening.following .veil{opacity:1}@keyframes ferretIdle{to{transform:translateX(-50%) translateY(-5px) rotate(1deg)}}@keyframes ferretRun{0%{bottom:-16%;transform:translateX(-50%) scale(1)}22%{transform:translateX(-47%) scale(.78) rotate(-2deg)}48%{transform:translateX(-53%) scale(.56) rotate(2deg)}76%{bottom:39%;transform:translateX(-49%) scale(.34) rotate(-1deg)}100%{bottom:57%;transform:translateX(-50%) scale(.12);opacity:.18}}
@media(max-width:700px){.world{background-size:auto 100%;background-position:center top}.copy{right:14px;left:14px;top:auto;bottom:6vh;width:auto;transform:none;padding:20px;background:rgba(2,8,15,.62)}h1{font-size:52px}.ferret{width:118px}.opening.following .copy{transform:translateY(15px)}}@media(prefers-reduced-motion:reduce){.ferret{animation:none}.world{transition:none}.opening.following .ferret{animation:none;opacity:0}.opening.following .veil{transition-delay:.1s}}
.copy{width:min(460px,46vw);padding:34px 42px 38px;background:linear-gradient(100deg,#3b2516f2,#21140deb);border:2px solid #81613c;border-radius:6px;box-shadow:inset 0 0 0 4px rgba(19,10,5,.38),inset 0 9px 24px rgba(255,207,125,.08),0 18px 45px rgba(0,0,0,.62);transform:translateY(-50%) rotate(-1.2deg)}.copy:before,.copy:after{content:"";position:absolute;top:18px;width:8px;height:8px;border-radius:50%;background:#b99357;box-shadow:inset 1px 1px 2px #ecd097,0 1px 3px #000}.copy:before{left:18px}.copy:after{right:18px}.copy h1{font-size:clamp(38px,4.8vw,68px);line-height:.95}.copy .eyebrow{color:#d9c08a}.copy p{margin-bottom:7px}.follow{font-size:10px;color:#fff0c8}@media(max-width:700px){.copy{width:min(88vw,370px);right:6vw;left:auto;bottom:5vh;padding:27px 28px 30px;transform:rotate(-1deg)}.copy h1{font-size:39px}.opening.following .copy{transform:translateY(15px) rotate(-1deg)}}
</style>
</head>
<body><main class="opening" id="opening"><div class="world" aria-hidden="true"></div><a class="brand" href="treehouse.html#top"><img src="assets/loom-briar-celestial-cat-logo.webp" alt=""><span>Loom Briar</span></a><section class="copy" aria-label="Woodland direction sign"><p class="eyebrow">This way through the Briar Woods</p><h1>Enter the Loom Briar Treehouse</h1><p>The moonlit path is open.</p><button class="follow" id="follow" type="button">Enter the Treehouse →</button></section><div class="veil" aria-hidden="true"></div></main><script>const opening=document.getElementById('opening'),button=document.getElementById('follow');button.addEventListener('click',()=>{if(opening.classList.contains('following'))return;opening.classList.add('following');button.disabled=true;setTimeout(()=>location.href='treehouse.html#top',4700)})</script></body>
</html>
